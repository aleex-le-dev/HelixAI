# Installation d'OpenClaw sous Windows (29/09/2026) : sur une vraie machine Windows jetable,
# le chemin exact de Helix quand on déploie un agent (installerOpenClaw de
# gateway/src/installationOpenClaw.ts) : Node privé téléchargé et vérifié, npm lancé par
# node.exe npm-cli.js avec les mêmes arguments et le même environnement, puis
# `openclaw --version` et une passerelle OpenClaw jetable sur un port libre.
# Né de « npm a échoué (code 1) », vu par Medhi le 29/09/2026 en déployant un agent.
# La sortie complète de l'installation et les journaux de npm sont gardés en artefact,
# que l'essai passe ou non. Rien n'est installé hors des dossiers temporaires.
name: Essai OpenClaw sous Windows

on:
  workflow_dispatch:
  push:
    branches: [essai-openclaw-windows]

permissions:
  contents: read

concurrency:
  group: essai-openclaw-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installation:
    name: Installation d'OpenClaw comme Helix la fait
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Fins de ligne telles qu'au dépôt, comme sur la machine qui fabrique les versions.
      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le Node qui fait tourner la passerelle (comme node gateway/src) ; OpenClaw, lui, est installé
      # par le Node privé que Helix télécharge (24.21.0, empreinte vérifiée).
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Installation réelle d'OpenClaw (chemin de Helix)
        run: node scripts/essai-openclaw-windows.mjs --installation --sortie essai-openclaw-windows-sortie

      - name: Garder les journaux
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essai-openclaw-windows-journaux
          path: essai-openclaw-windows-sortie
          if-no-files-found: warn
          retention-days: 14
